name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Public website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  admin:
    name: Admin portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api:
    name: API and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bangalore_taxi
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: bangalore_taxi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bangalore_taxi -d bangalore_taxi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCHEMA_TEST_CONNECTION: Host=localhost;Port=5432;Database=bangalore_taxi_test;Username=bangalore_taxi;Password=dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test BangaloreTaxi.sln --nologo --configuration Release
