# Local development only. Do not use these credentials in production.
services:
  postgres:
    image: postgres:16
    container_name: bangalore-taxi-pg
    environment:
      POSTGRES_USER: bangalore_taxi
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: bangalore_taxi
    ports:
      - "5432:5432"
    volumes:
      - bangalore_taxi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bangalore_taxi -d bangalore_taxi"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  bangalore_taxi_pgdata:
